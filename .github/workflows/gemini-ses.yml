name: Gemini ses örnekleri
on:
  push:
    branches: [seslendirme]
    paths: [".github/workflows/gemini-ses.yml", "video/ornek-ses.txt"]
  workflow_dispatch:
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gemini TTS (ücretsiz anahtar)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          txt=$(cat video/ornek-ses.txt)
          for v in Charon Orus Kore Aoede; do
            ok=0
            for m in gemini-3.8-flash-tts gemini-3.1-flash-tts-preview gemini-2.5-flash-preview-tts; do
              jq -n --arg t "Doğal, samimi ve enerjik bir Türk YouTube sunucusu gibi, akıcı İstanbul Türkçesiyle oku: $txt" --arg v "$v" \
                '{contents:[{parts:[{text:$t}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$v}}}}}' > req.json
              code=$(curl -sS -o resp.json -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" -d @req.json)
              echo "$v $m HTTP $code"
              if [ "$code" = "200" ]; then
                jq -r '.candidates[0].content.parts[0].inlineData.data' resp.json | base64 -d > out/$v.pcm && ffmpeg -y -v error -f s16le -ar 24000 -ac 1 -i out/$v.pcm out/ornek-$v.mp3 && rm out/$v.pcm && ok=1 && echo "model=$m" >> out/model.txt && break
              else head -c 300 resp.json; echo; fi
            done
            sleep 8
          done
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-ses
          path: out/
          retention-days: 3
