name: Gerçek Gemini testleri (gece)
# Gerçek Gemini ile çalışan bilgi amaçlı testler. Ücretsiz Gemini kotası canlı sitedeki kullanıcılarla (Free paket, ücretsiz kontrol)
# ortak olduğu için her PR'da değil, günde bir kez ve elle istenince çalışır. Bu dosya değişince de çalışır.
on:
  schedule:
    - cron: "17 2 * * *"   # her gece 05:17 (Türkiye)
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gemini-nightly.yml
permissions:
  contents: read
concurrency:
  group: gemini-nightly
  cancel-in-progress: true

jobs:
  # ---------------- Gerçek Gemini (bilgi amaçlı; Google'daki geçici sorunlar yayını durdurmaz) ----------------
  e2e-gemini:
    name: Uçtan uca, gerçek Gemini ile (bilgi amaçlı)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      # GitHub paket aynası zaman zaman yanıt vermiyor: en fazla 4 dakika bekle, olmazsa sistem paketleri olmadan kur (tarayıcı çalışır).
      - run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Uçtan uca testler (gerçek Gemini, aramasız, ücretsiz)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx playwright test
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri-gercek-gemini
          path: e2e/screenshots/
          retention-days: 14

  gemini-smoke:
    name: Gerçek Gemini bağlantı testi (bilgi amaçlı)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gerçek Gemini bağlantı testi (anahtar yoksa atlanır)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TIER: free
          ALLOW_PAID_API: "false"
        run: npm run smoke:gemini
