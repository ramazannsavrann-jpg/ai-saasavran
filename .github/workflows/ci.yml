name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Birim + veritabanı + arayüz derleme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix web
      - name: Gizli bilgi taraması
        run: npm run scan:secrets
      - name: Motor testleri
        run: npm test
      - name: Veritabanı + RLS + kota testleri (PGlite)
        run: npm run test:db
      - name: Paket maliyet tablosu
        run: npm run pricing
      - name: Arayüz tip kontrolü ve derleme
        run: npm run build --prefix web

  integration:
    name: Entegrasyon (gerçek Postgres + Supabase Auth + PostgREST)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Postgres 16 ikilileri
        run: ls /usr/lib/postgresql/16/bin/initdb && psql --version
      - name: Entegrasyon testleri
        run: npm run test:integration

  e2e:
    name: Mobil uçtan uca test
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      # GitHub paket aynası zaman zaman yanıt vermiyor: en fazla 4 dakika bekle, olmazsa sistem paketleri olmadan kur (tarayıcı çalışır).
      - run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      # Yayın kararı dış servislere bağlı olmasın: burada sabit test cevapları kullanılır.
      # Gerçek Gemini ile aynı akış her gece ayrı iş akışında çalışır (.github/workflows/gemini-nightly.yml).
      - name: Uçtan uca testler
        run: npx playwright test
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: |
            e2e/screenshots/
            test-results/
          retention-days: 14

  # ---------------- Yayın (yalnızca main dalı ve tüm testler geçtiyse) ----------------
  deploy-check:
    name: Yayın ayarları var mı?
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.c.outputs.db }}
      web: ${{ steps.c.outputs.web }}
    steps:
      - id: c
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "db=$([ -n "$DB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -n "$URL" ] && [ -n "$ANON" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACC" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$DB" ] || echo "::notice::SUPABASE_DB_URL yok: veritabanı kurulumu atlandı"
          [ -n "$CF_TOKEN" ] || echo "::notice::Cloudflare ayarları yok: site yayını atlandı"

  deploy-db:
    name: Veritabanını güncelle (Supabase)
    needs: deploy-check
    if: needs.deploy-check.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-db, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Migration'ları uygula
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/migrate.mjs
      - name: Güvenlik denetimi (RLS, ziyaretçi yetkileri, arama yolu)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/security-audit.mjs

  labs-seed:
    name: Demo Lab ve Growth Lab'i hazırla
    needs: deploy-db
    if: needs.deploy-db.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Laboratuvarları oluştur (yoksa)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
        run: |
          if [ -z "$PLATFORM_ADMIN_EMAIL" ]; then echo "PLATFORM_ADMIN_EMAIL tanımlı değil; atlandı."; exit 0; fi
          node scripts/labs-seed.ts

  deploy-web:
    name: Siteyi yayınla (Cloudflare Pages)
    needs: [deploy-check, deploy-db]
    if: always() && needs.deploy-check.outputs.web == 'true' && (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: { group: deploy-web, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Paddle katalog (fiyatlar ve bildirim hedefi)
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: |
          umask 077
          if [ -n "$PADDLE_API_KEY" ]; then PADDLE_SECRET_OUT="$RUNNER_TEMP/whsec" PADDLE_CATALOG_OUT="$RUNNER_TEMP/paddle-catalog.json" node scripts/paddle-setup.mjs; else echo "Paddle anahtarı yok; ödeme ayarı atlandı."; fi
      - name: Yayın ayarları (config.json, güvenlik başlıkları)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PADDLE_CLIENT_TOKEN: ${{ secrets.PADDLE_CLIENT_TOKEN }}
          PADDLE_CATALOG_FILE: ${{ runner.temp }}/paddle-catalog.json
        run: node scripts/web-release.mjs
      - name: Cloudflare Pages projesi (yoksa oluştur)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.161.0 pages project create ai-saasavran --production-branch main || echo "Proje zaten var"
      - name: Sunucu ayarları (Paddle katalog ve bildirim hedefi; Cloudflare sunucu anahtarları)
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WORKER_DISPATCH_TOKEN: ${{ secrets.WORKER_DISPATCH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          node -e 'const fs=require("fs");const e=process.env;const o={};const w=process.argv[2];if(fs.existsSync(w))o.PADDLE_WEBHOOK_SECRET=fs.readFileSync(w,"utf8");for(const k of ["PADDLE_API_KEY","GEMINI_API_KEY","WORKER_DISPATCH_TOKEN","SUPABASE_URL","SUPABASE_ANON_KEY","SUPABASE_SERVICE_ROLE_KEY"])if(e[k])o[k]=e[k];fs.writeFileSync(process.argv[1],JSON.stringify(o));console.log("Sunucu anahtarları: "+Object.keys(o).join(", "))' "$RUNNER_TEMP/pages-secrets.json" "$RUNNER_TEMP/whsec"
          # Cloudflare API ara sıra 503 veriyor (13 Kasım 2026'da üç yayın bu yüzden düştü): 5 deneme, artan bekleme
          ok=0; for i in 1 2 3 4 5; do
            if npx --yes wrangler@4.161.0 pages secret bulk "$RUNNER_TEMP/pages-secrets.json" --project-name ai-saasavran > /dev/null; then ok=1; break; fi
            echo "Cloudflare cevap vermedi (deneme $i/5), $((i*30)) sn sonra tekrar"; sleep $((i*30))
          done
          [ "$ok" = 1 ] || { rm -f "$RUNNER_TEMP/whsec" "$RUNNER_TEMP/pages-secrets.json"; exit 1; }
          rm -f "$RUNNER_TEMP/whsec" "$RUNNER_TEMP/pages-secrets.json"
      - name: Yayınla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare API ara sıra 503 veriyor: 5 deneme, artan bekleme
          for i in 1 2 3 4 5; do
            if npx --yes wrangler@4.161.0 pages deploy web/dist --project-name ai-saasavran --branch main --commit-dirty=true; then exit 0; fi
            echo "Yayın başarısız (deneme $i/5), $((i*30)) sn sonra tekrar"; sleep $((i*30))
          done
          exit 1

  live-check:
    name: Canlı site kontrolü
    needs: deploy-web
    if: needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # GitHub paket aynası zaman zaman yanıt vermiyor: en fazla 4 dakika bekle, olmazsa sistem paketleri olmadan kur (tarayıcı çalışır).
      - run: timeout 240 npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Canlı siteyi kontrol et
        env:
          LIVE_URL: https://aisaasavran.com
        run: |
          sleep 20  # Cloudflare'in yeni sürümü dağıtması için kısa bekleme
          npx playwright test e2e/live.e2e.ts
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canli-site
          path: e2e/screenshots/
          retention-days: 14
