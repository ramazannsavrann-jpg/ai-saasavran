name: CI
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Birim + veritabanı + arayüz derleme
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix web
      - name: Gizli bilgi taraması
        run: npm run scan:secrets
      - name: Motor testleri
        run: npm test
      - name: Veritabanı + RLS + kota testleri (PGlite)
        run: npm run test:db
      - name: Paket maliyet tablosu
        run: npm run pricing
      - name: Arayüz tip kontrolü ve derleme
        run: npm run build --prefix web

  integration:
    name: Entegrasyon (gerçek Postgres + Supabase Auth + PostgREST)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Postgres 16 ikilileri
        run: ls /usr/lib/postgresql/16/bin/initdb && psql --version
      - name: Entegrasyon testleri
        run: npm run test:integration

  e2e:
    name: Mobil uçtan uca test (gerçek Gemini, aramasız, ücretsiz)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npx playwright install --with-deps chromium
      - name: Uçtan uca testler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx playwright test
      - name: Ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: |
            e2e/screenshots/
            test-results/
          retention-days: 14

  gemini-smoke:
    name: Gerçek Gemini bağlantı testi
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Gerçek Gemini bağlantı testi (anahtar yoksa atlanır)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TIER: free
          ALLOW_PAID_API: "false"
        run: npm run smoke:gemini

  # ---------------- Yayın (yalnızca main dalı ve tüm testler geçtiyse) ----------------
  deploy-check:
    name: Yayın ayarları var mı?
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.c.outputs.db }}
      web: ${{ steps.c.outputs.web }}
    steps:
      - id: c
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          URL: ${{ secrets.SUPABASE_URL }}
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "db=$([ -n "$DB" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -n "$URL" ] && [ -n "$ANON" ] && [ -n "$CF_TOKEN" ] && [ -n "$CF_ACC" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$DB" ] || echo "::notice::SUPABASE_DB_URL yok: veritabanı kurulumu atlandı"
          [ -n "$CF_TOKEN" ] || echo "::notice::Cloudflare ayarları yok: site yayını atlandı"

  deploy-db:
    name: Veritabanını güncelle (Supabase)
    needs: deploy-check
    if: needs.deploy-check.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-db, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Migration'ları uygula
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/migrate.mjs

  deploy-web:
    name: Siteyi yayınla (Cloudflare Pages)
    needs: [deploy-check, deploy-db]
    if: always() && needs.deploy-check.outputs.web == 'true' && (needs.deploy-db.result == 'success' || needs.deploy-db.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: deploy-web, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - name: Yayın ayarları (config.json, güvenlik başlıkları)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/web-release.mjs
      - name: Cloudflare Pages projesi (yoksa oluştur)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create ai-saasavran --production-branch main || echo "Proje zaten var"
      - name: Yayınla
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web/dist --project-name ai-saasavran --branch main --commit-dirty=true
