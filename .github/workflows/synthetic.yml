name: Günlük sahte müşteri testi
# Her sabah canlı sitede gerçek müşteri gibi dolaşır (giriş → marka → soru → rakip → rapor → paylaşım).
# Yapay zekâ çağrısı yapmaz; test hesabı ve verisi sonunda silinir. Hata olursa GitHub'da bir "issue" açılır.
on:
  schedule:
    - cron: "37 3 * * *"   # 06:37 Türkiye
  push:
    paths: [".github/workflows/synthetic.yml", "e2e/synthetic.e2e.ts"]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Sahte müşteri testi (canlı site)
        env:
          SYNTH_URL: https://aisaasavran.com
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test e2e/synthetic.e2e.ts
      - name: Hata olursa issue aç
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo,
              title: `Sahte müşteri testi başarısız (${new Date().toISOString().slice(0,10)})`,
              body: `Canlı sitedeki günlük akış testi hata verdi: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
