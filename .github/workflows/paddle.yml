# Paddle ödeme ayarları: katalog (ürün ve fiyatlar). Anahtar yazdırılmaz.
name: Paddle kurulumu
on:
  push:
    paths: ["scripts/paddle-setup.mjs", ".github/workflows/paddle.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Katalog
        env:
          PADDLE_API_KEY: ${{ secrets.PADDLE_API_KEY }}
        run: node scripts/paddle-setup.mjs
