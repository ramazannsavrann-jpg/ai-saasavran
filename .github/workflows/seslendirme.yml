name: Seslendirme (video)
on:
  push:
    branches: [seslendirme]
    paths: [".github/workflows/seslendirme.yml", "video/**"]
  workflow_dispatch:
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Seslendirme (TR = Gemini ücretsiz, EN = OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out
          # Push'ta yalnız değişen anlatım dosyaları seslendirilir (ücretsiz günlük sınırı korumak için).
          if [ "${{ github.event_name }}" = "push" ]; then files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'video/narration-*.txt'); else files=$(ls video/narration-*.txt); fi
          echo "Seslendirilecek: $files"
          for f in $files; do
            name=$(basename "$f" .txt | sed 's/narration-//'); lang="${name##*-}"
            trvoice=$(cat "video/ses-$name.txt" 2>/dev/null || cat video/ses-tr.txt 2>/dev/null || echo Charon)
            if [ "$lang" = "tr" ] || [ "$lang" = "en" ]; then
              ok=0
              if [ "$lang" = "en" ]; then pre="Read this like a natural, warm, energetic YouTube host, in clear American English: "; else pre="Doğal, samimi ve enerjik bir Türk YouTube sunucusu gibi, akıcı İstanbul Türkçesiyle oku: "; fi
              for m in gemini-2.5-flash-preview-tts gemini-3.1-flash-tts-preview gemini-3.8-flash-tts; do
                jq -n --rawfile t "$f" --arg v "$trvoice" --arg pre "$pre" '{contents:[{parts:[{text:($pre + $t)}]}],generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:$v}}}}}' > req.json
                code=$(curl -sS -o resp.json -w "%{http_code}" "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent" -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" -d @req.json)
                echo "$lang $trvoice $m HTTP $code"; sleep 2
                if [ "$code" = "200" ]; then jq -r '.candidates[0].content.parts[0].inlineData.data' resp.json | base64 -d > out/ses-$name.pcm; echo "$m $trvoice" > out/ses-$name-model.txt; ok=1; break; fi
                head -c 300 resp.json; echo
              done
              [ "$ok" = 1 ] && continue
              # Eğitim videoları (e*) sabit Gemini sesiyle yapılır; ses değişmesin diye OpenAI'ye düşülmez.
              case "$name" in e[0-9]*) echo "Gemini olmadı ($name), atlandı"; continue;; esac
              echo "Gemini olmadı, OpenAI'ye düşülüyor"
            fi
            if [ "$lang" = "en" ]; then ins="Speak English. Energetic, upbeat, friendly YouTube Shorts host; brisk but clear."; else ins="Türkçe konuş. Enerjik, samimi bir YouTube Shorts sunucusu gibi; doğal Türkçe vurgu."; fi
            jq -n --rawfile t "$f" --arg ins "$ins" '{model:"gpt-4o-mini-tts", voice:"ash", input:$t, response_format:"mp3", instructions:$ins}' > req.json
            curl -sS --fail-with-body https://api.openai.com/v1/audio/speech -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" -d @req.json -o "out/ses-$name.mp3"
            ls -l "out/ses-$name.mp3"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: seslendirme
          path: out/
          retention-days: 3
