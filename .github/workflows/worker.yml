# Ölçüm işçisi: sıradaki ölçümleri işler. Supabase bağlanana kadar "ATLANDI" der.
# Zamanlama: İstanbul saatiyle 08:00–23:00 arası her saat (günde 16 çalıştırma, ~1 dk).
# Özel depoda GitHub Actions ücretsiz kotası ayda 2.000 dakikadır; bu iş ~500 dakika kullanır.
name: Ölçüm işçisi
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 5-20 * * *"
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Kuyruğu işle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TIER: free
          ALLOW_PAID_API: "false"
        run: npm run worker
