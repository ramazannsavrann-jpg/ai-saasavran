# Ölçüm işçisi: sıradaki ölçümleri işler. Supabase bağlanana kadar "ATLANDI" der.
# Zamanlama: İstanbul saatiyle 08:00–23:00 arası her saat (günde 16 çalıştırma, ~1 dk).
# Depo herkese açık olduğu için GitHub Actions dakikaları ücretsizdir. Depo gizli yapılırsa ayda 2.000 dakika kotası geçerli olur.
# İş süresi sınırı 45 dk; işçi 25 dk sonra yeni ölçüm almaz; 60 dk'dan eski "çalışıyor" ölçümler kapatılır (0012).
name: Ölçüm işçisi
on:
  # Yalnızca ana dal: taslak dallardaki kod gerçek veritabanına dokunmasın
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5-20 * * *"
permissions:
  contents: read
concurrency:
  group: worker
  cancel-in-progress: false
jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Kuyruğu işle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLATFORM_ADMIN_EMAIL: ${{ secrets.PLATFORM_ADMIN_EMAIL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GEMINI_TIER: free
          # Ücretli API açık, ama yalnız veritabanında izinli alanda (Growth Lab) ve toplam 3 $ tavanıyla kullanılır.
          # Kullanıcı izni: 7 Kasım 2026. Müşteri alanlarında ücretli çağrı veritabanı tarafından reddedilir.
          ALLOW_PAID_API: "true"
          # "Önerildi mi" LLM kontrolü: yalnız ücretli OpenAI ölçümlerinde, cevap başına ~0,0003 $; paket tavanına sayılır.
          LLM_CLASSIFY: "true"
        run: npm run worker
