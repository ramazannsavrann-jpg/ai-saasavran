name: Mobil uygulama derleme kontrolü (Android)
# Dalda yapılan değişiklikte Android uygulamasının derlenip derlenmediğine bakar. İmzasız deneme APK'sı yalnız
# 7 gün saklanan bir iş çıktısıdır; sürüm yayınlamaz, mağazaya yüklemez.
on:
  push:
    branches-ignore: [main]
    paths: ["web/src/mobile/**", "web/src/lib/**", "web/android/**", "web/capacitor.config.json", "web/vite.mobile.config.ts", "web/mobile.html", "web/package.json", ".github/workflows/mobil-android-kontrol.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobil-android-kontrol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --prefix web
      - name: Ekranları derle ve Android projesine kopyala
        working-directory: web
        run: |
          npm run build:mobile
          npx cap sync android
      - name: Android deneme derlemesi
        working-directory: web/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: deneme-apk
          path: web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
